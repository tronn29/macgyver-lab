<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- 1 : le métal renvoie l'onde (blocage). 2 : un brouilleur noie le signal (interdit) -->
  <g>
    <circle class="s-badge" cx="24" cy="20" r="9"/>
    <text class="s-badge-text" x="24" y="20">1</text>
    <text class="s-label" x="38" y="24">Bloquer : le métal renvoie</text>
    <path class="s-accent s-flow" d="M20 80 q 6 -10 12 0 q 6 10 12 0 q 6 -10 12 0 q 6 10 12 0 q 6 -10 12 0 q 6 10 12 0 q 6 -10 12 0 q 6 10 12 0"/>
    <rect class="s-solid" x="120" y="50" width="10" height="64"/>
    <rect class="s-fill-accent" x="120" y="50" width="10" height="64"/>
    <path class="s-accent" d="M116 92 L84 112" marker-end="url(#mg-arrow-accent)"/>
    <text class="s-tiny" x="125" y="128" text-anchor="middle">métal</text>
    <rect class="s-solid" x="150" y="68" width="22" height="30" rx="3"/>
    <text class="s-tiny" x="161" y="112" text-anchor="middle">récepteur</text>
    <text class="s-tiny s-text-hot" x="161" y="62" text-anchor="middle">plus rien</text>
  </g>
  <path class="s-thin" d="M190 40 V170"/>
  <g>
    <circle class="s-badge-hot" cx="208" cy="20" r="9"/>
    <text class="s-badge-text" x="208" y="20">2</text>
    <text class="s-label" x="222" y="24">Brouiller : interdit</text>
    <path class="s-accent" d="M208 72 q 6 -10 12 0 q 6 10 12 0 q 6 -10 12 0 q 6 10 12 0 q 6 -10 12 0 q 6 10 12 0 q 6 -10 12 0 q 6 10 12 0 q 6 -10 12 0 q 6 10 12 0"/>
    <text class="s-tiny s-text-accent" x="274" y="58" text-anchor="middle">signal légitime</text>
    <path class="s-hot s-pulse" d="M208 104 l6 -14 l6 22 l6 -26 l6 30 l6 -22 l6 18 l6 -28 l6 26 l6 -20 l6 24 l6 -18 l6 22 l6 -26 l6 20 l6 -14 l6 18 l6 -22 l6 16 l6 -12 l6 10 l6 -8"/>
    <text class="s-tiny s-text-hot" x="274" y="140" text-anchor="middle">signal plus fort,</text>
    <text class="s-tiny s-text-hot" x="274" y="154" text-anchor="middle">même fréquence</text>
  </g>
  <g>
    <rect class="s-callout" x="14" y="186" width="332" height="42" rx="4"/>
    <text class="s-tiny" x="180" y="203" text-anchor="middle">Même résultat apparent : plus de réception</text>
    <text class="s-tiny s-text-accent" x="180" y="219" text-anchor="middle">mais deux mécanismes sans rapport</text>
  </g>
</svg>
