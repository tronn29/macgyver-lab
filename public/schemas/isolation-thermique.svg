<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- 1 : conduction, par contact -->
  <g>
    <circle class="s-badge" cx="24" cy="26" r="9"/>
    <text class="s-badge-text" x="24" y="26">1</text>
    <text class="s-label" x="38" y="30">Conduction</text>
    <text class="s-tiny s-text-hot" x="42" y="66" text-anchor="middle">chaud</text>
    <text class="s-tiny s-text-cold" x="86" y="66" text-anchor="middle">froid</text>
    <rect class="s-solid" x="20" y="74" width="44" height="56"/>
    <rect class="s-fill-hot" x="20" y="74" width="44" height="56"/>
    <rect class="s-solid" x="64" y="74" width="44" height="56"/>
    <rect class="s-fill-cold" x="64" y="74" width="44" height="56"/>
    <path class="s-hot s-flow" d="M30 102 H98" marker-end="url(#mg-arrow-hot)"/>
    <text class="s-tiny" x="64" y="146" text-anchor="middle">contact</text>
    <rect class="s-callout" x="16" y="160" width="96" height="62" rx="4"/>
    <text class="s-tiny s-text-accent" x="64" y="176" text-anchor="middle">parade :</text>
    <text class="s-tiny" x="64" y="192" text-anchor="middle">air immobile</text>
    <text class="s-tiny" x="64" y="208" text-anchor="middle">laine, duvet</text>
  </g>

  <path class="s-dash" d="M121 44 V226 M239 44 V226"/>

  <!-- 2 : convection, l'air qui bouge emporte la chaleur -->
  <g>
    <circle class="s-badge" cx="134" cy="26" r="9"/>
    <text class="s-badge-text" x="134" y="26">2</text>
    <text class="s-label" x="148" y="30">Convection</text>
    <text class="s-tiny" x="180" y="58" text-anchor="middle">air qui bouge</text>
    <path class="s-hot s-flow" d="M164 128 C150 100 156 76 178 72" marker-end="url(#mg-arrow-hot)"/>
    <path class="s-cold s-flow" d="M184 72 C206 76 212 100 198 128" marker-end="url(#mg-arrow-cold)"/>
    <rect class="s-solid" x="140" y="134" width="80" height="8" rx="2"/>
    <rect class="s-fill-hot" x="140" y="134" width="80" height="8" rx="2"/>
    <text class="s-tiny s-text-hot" x="180" y="154" text-anchor="middle">source chaude</text>
    <rect class="s-callout" x="128" y="160" width="104" height="62" rx="4"/>
    <text class="s-tiny s-text-accent" x="180" y="176" text-anchor="middle">parade :</text>
    <text class="s-tiny" x="180" y="192" text-anchor="middle">bloquer le vent</text>
    <text class="s-tiny" x="180" y="208" text-anchor="middle">fibres serrées</text>
  </g>

  <!-- 3 : rayonnement infrarouge, renvoyé par un film métallisé -->
  <g>
    <circle class="s-badge" cx="250" cy="26" r="9"/>
    <text class="s-badge-text" x="250" y="26">3</text>
    <text class="s-label" x="264" y="30">Rayonnement</text>
    <circle class="s-solid" cx="262" cy="104" r="16"/>
    <circle class="s-fill-hot" cx="262" cy="104" r="16"/>
    <text class="s-tiny s-text-hot" x="262" y="136" text-anchor="middle">37 °C</text>
    <path class="s-accent" d="M322 62 Q330 104 322 146"/>
    <text class="s-tiny s-text-accent" x="324" y="56" text-anchor="middle">film</text>
    <text class="s-tiny s-text-hot" x="298" y="82" text-anchor="middle">IR</text>
    <g class="s-pulse">
      <path class="s-hot" d="M280 92 q4.5 -5 9 0 t9 0 t9 0 t9 0 h3" marker-end="url(#mg-arrow-hot)"/>
      <path class="s-hot" d="M318 116 q-4.5 5 -9 0 t-9 0 t-9 0 t-9 0 h-3" marker-end="url(#mg-arrow-hot)"/>
    </g>
    <rect class="s-callout" x="244" y="160" width="104" height="62" rx="4"/>
    <text class="s-tiny s-text-accent" x="296" y="176" text-anchor="middle">parade :</text>
    <text class="s-tiny" x="296" y="192" text-anchor="middle">film métallisé</text>
    <text class="s-tiny" x="296" y="208" text-anchor="middle">≈ 90 % renvoyé</text>
  </g>
</svg>
