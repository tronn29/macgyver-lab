    <path class="s-accent" d="M142 112 H122" marker-end="url(#mg-arrow)"/>
    <text class="s-tiny s-text-accent" x="88" y="52">O₂</text>
    <path class="s-dim" d="M41 135 L76 155" marker-start="url(#mg-tick)" marker-end="url(#mg-tick)"/>
    <text class="s-tiny" x="50" y="160" text-anchor="end">1 cm</text>
    <text class="s-small" x="80" y="176" text-anchor="middle">surface : 6 cm²</text>
    <text class="s-tiny" x="80" y="192" text-anchor="middle">combustion lente</text>
  </g>

  <!-- Même masse, finement divisée -->
  <g>
    <path class="s-line" d="M150 110 H198" marker-end="url(#mg-arrow)"/>
