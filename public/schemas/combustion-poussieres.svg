  <!-- 1 : un bloc compact : seules ses faces touchent l’oxygène -->
  <g>
    <circle class="s-badge" cx="24" cy="26" r="9"/>
    <text class="s-badge-text" x="24" y="26">1</text>
    <text class="s-label" x="38" y="30">En bloc</text>
    <polygon class="s-solid" points="80,70 114.6,90 80,110 45.4,90"/>
