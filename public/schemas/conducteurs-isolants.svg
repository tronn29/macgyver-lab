    <text class="s-label" x="38" y="30">Conducteur</text>
    <rect class="s-ghost" x="24" y="50" width="140" height="60" rx="4"/>
    <circle class="s-solid" cx="38" cy="66" r="5"/>
    <circle class="s-solid" cx="66" cy="66" r="5"/>
    <circle class="s-solid" cx="94" cy="66" r="5"/>
    <circle class="s-solid" cx="122" cy="66" r="5"/>
    <circle class="s-solid" cx="150" cy="66" r="5"/>
    <circle class="s-solid" cx="38" cy="94" r="5"/>
    <circle class="s-solid" cx="66" cy="94" r="5"/>
    <circle class="s-solid" cx="94" cy="94" r="5"/>
    <circle class="s-solid" cx="122" cy="94" r="5"/>
    <circle class="s-solid" cx="150" cy="94" r="5"/>
