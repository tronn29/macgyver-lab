    <text class="s-tiny" x="60" y="213" text-anchor="middle">graphite</text>
    <text class="s-tiny" x="106" y="186" text-anchor="middle">eau salée</text>
    <text class="s-tiny" x="152" y="213" text-anchor="middle">eau pure</text>
    <text class="s-tiny" x="208" y="186" text-anchor="middle">verre</text>
    <text class="s-tiny" x="238" y="213" text-anchor="middle">bois sec</text>
    <text class="s-tiny s-text-hot" x="330" y="186" text-anchor="middle">téflon</text>
    <text class="s-tiny s-text-accent" x="24" y="228">conducteurs</text>
    <text class="s-tiny" x="180" y="228" text-anchor="middle">10⁻⁸ → 10²⁴ Ω·m</text>
    <text class="s-tiny s-text-hot" x="336" y="228" text-anchor="end">isolants</text>
  </g>
