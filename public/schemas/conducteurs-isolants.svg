    <circle class="s-solid" cx="322" cy="94" r="4"/>
    <circle class="s-badge" cx="220" cy="66" r="2"/>
    <circle class="s-badge" cx="232" cy="61" r="2"/>
    <circle class="s-badge" cx="270" cy="72" r="2"/>
    <circle class="s-badge" cx="304" cy="66" r="2"/>
    <circle class="s-badge" cx="316" cy="61" r="2"/>
    <circle class="s-badge" cx="200" cy="94" r="2"/>
    <circle class="s-badge" cx="242" cy="100" r="2"/>
    <circle class="s-badge" cx="276" cy="94" r="2"/>
