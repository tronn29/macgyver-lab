    <ellipse class="s-thin" cx="238" cy="66" rx="10" ry="6"/>
    <ellipse class="s-thin" cx="266" cy="66" rx="10" ry="6"/>
    <ellipse class="s-thin" cx="294" cy="66" rx="10" ry="6"/>
    <ellipse class="s-thin" cx="322" cy="66" rx="10" ry="6"/>
