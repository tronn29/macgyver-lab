<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- Séparateurs : en haut, révéler puis relever ; en bas, capteur optique | capteur capacitif -->
  <path class="s-dash" d="M178 12 V96"/>
  <path class="s-dash" d="M10 104 H350"/>
  <path class="s-dash" d="M178 110 V232"/>

  <!-- 1 : le film gras laissé par les crêtes retient la poudre -->
  <g>
    <circle class="s-badge" cx="18" cy="18" r="9"/>
    <text class="s-badge-text" x="18" y="18">1</text>
    <text class="s-label" x="32" y="22">Révéler</text>
    <path class="s-solid" d="M18 56 Q24 49 30 56 Q36 49 42 56 Q48 49 54 56 Q60 49 66 56 Q72 49 78 56 Q84 49 90 56 Q96 49 102 56 Q107 49 112 54 L112 40 Q65 28 18 40 Z"/>
    <circle class="s-solid s-float" cx="48" cy="63" r="1.6"/>
    <circle class="s-solid s-float s-delay-1" cx="80" cy="64" r="1.6"/>
    <ellipse class="s-fill-accent" cx="30" cy="72" rx="3.5" ry="2"/>
    <ellipse class="s-fill-accent" cx="42" cy="72" rx="3.5" ry="2"/>
    <ellipse class="s-fill-accent" cx="54" cy="72" rx="3.5" ry="2"/>
    <ellipse class="s-fill-accent" cx="66" cy="72" rx="3.5" ry="2"/>
    <ellipse class="s-fill-accent" cx="78" cy="72" rx="3.5" ry="2"/>
    <ellipse class="s-fill-accent" cx="90" cy="72" rx="3.5" ry="2"/>
    <ellipse class="s-fill-accent" cx="102" cy="72" rx="3.5" ry="2"/>
    <path class="s-line" d="M28 70 H32 M40 70 H44 M52 70 H56 M64 70 H68 M76 70 H80 M88 70 H92 M100 70 H104"/>
    <rect class="s-fill-cold" x="12" y="74" width="106" height="6"/>
    <path class="s-line" d="M12 74 H118"/>
    <text class="s-tiny" x="65" y="92" text-anchor="middle">film gras + poudre</text>
  </g>

  <!-- 2 : l'empreinte révélée, relevée sur un adhésif -->
  <g>
    <circle class="s-badge" cx="196" cy="18" r="9"/>
    <text class="s-badge-text" x="196" y="18">2</text>
    <text class="s-label" x="210" y="22">Relever</text>
    <path class="s-line" d="M228 80 Q228 36 250 36 Q272 36 272 80"/>
    <path class="s-line" d="M234 80 Q234 44 250 44 Q266 44 266 80"/>
    <path class="s-line" d="M240 80 Q240 52 250 52 Q260 52 260 80"/>
    <path class="s-line" d="M245 80 Q245 60 250 60 Q255 60 255 80"/>
    <path class="s-line" d="M280 58 H294" marker-end="url(#mg-arrow)"/>
    <rect class="s-ghost" x="300" y="38" width="46" height="40" rx="3"/>
    <path class="s-thin" d="M310 74 Q310 50 323 50 Q336 50 336 74 M316 74 Q316 58 323 58 Q330 58 330 74"/>
    <text class="s-tiny" x="250" y="92" text-anchor="middle">empreinte</text>
    <text class="s-tiny" x="323" y="92" text-anchor="middle">adhésif</text>
  </g>

  <!-- 3 : ancien capteur optique : une photo du relief -->
  <g>
    <circle class="s-badge" cx="18" cy="118" r="9"/>
    <text class="s-badge-text" x="18" y="118">3</text>
    <text class="s-label" x="32" y="122">Capteur optique</text>
    <path class="s-line" d="M44 148 Q49 142 54 148 Q59 142 64 148 Q69 142 74 148 Q79 142 84 148 Q89 142 94 148"/>
    <polygon class="s-solid" points="34,150 106,150 92,174 48,174"/>
    <circle class="s-fill-hot s-pulse" cx="28" cy="198" r="4"/>
    <rect class="s-solid" x="100" y="192" width="16" height="11" rx="2"/>
    <path class="s-accent" d="M32 195 L60 174 L88 194" marker-end="url(#mg-arrow-accent)"/>
    <text class="s-tiny" x="70" y="216" text-anchor="middle">photo du relief</text>
    <text class="s-tiny s-text-hot" x="70" y="230" text-anchor="middle">faux doigt : trompé</text>
  </g>

  <!-- 4 : capteur capacitif : un champ électrique qui « sent » la peau vivante -->
  <g>
    <circle class="s-badge" cx="196" cy="118" r="9"/>
    <text class="s-badge-text" x="196" y="118">4</text>
    <text class="s-label" x="210" y="122">Capteur capacitif</text>
    <text class="s-tiny" x="210" y="137">+ pouls, température</text>
    <path class="s-line" d="M216 160 Q222 153 228 160 Q234 153 240 160 Q246 153 252 160 Q258 153 264 160 Q270 153 276 160 Q282 153 288 160 Q294 153 300 160 Q306 153 312 160 Q318 153 324 160 Q330 153 336 160"/>
    <path class="s-cold s-flow" d="M228 164 V180 M252 164 V180 M276 164 V180 M300 164 V180 M324 164 V180"/>
    <rect class="s-solid" x="218" y="182" width="8" height="8" rx="1"/>
    <rect class="s-solid" x="230" y="182" width="8" height="8" rx="1"/>
    <rect class="s-solid" x="242" y="182" width="8" height="8" rx="1"/>
    <rect class="s-solid" x="254" y="182" width="8" height="8" rx="1"/>
    <rect class="s-solid" x="266" y="182" width="8" height="8" rx="1"/>
    <rect class="s-solid" x="278" y="182" width="8" height="8" rx="1"/>
    <rect class="s-solid" x="290" y="182" width="8" height="8" rx="1"/>
    <rect class="s-solid" x="302" y="182" width="8" height="8" rx="1"/>
    <rect class="s-solid" x="314" y="182" width="8" height="8" rx="1"/>
    <rect class="s-solid" x="326" y="182" width="8" height="8" rx="1"/>
    <text class="s-tiny" x="276" y="204" text-anchor="middle">champ électrique</text>
    <text class="s-tiny s-text-cold" x="276" y="218" text-anchor="middle">peau vivante : lue</text>
    <text class="s-tiny s-text-hot" x="276" y="232" text-anchor="middle">adhésif : invisible</text>
  </g>
</svg>
