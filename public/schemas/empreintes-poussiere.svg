<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- Étape 1 : les crêtes du doigt touchent la vitre -->
  <g>
    <circle class="s-badge" cx="24" cy="30" r="9"/>
    <text class="s-badge-text" x="24" y="30">1</text>
    <text class="s-label" x="38" y="34">Contact</text>

    <path class="s-line" d="M64 46 V60" marker-end="url(#mg-arrow)"/>
    <path class="s-solid" d="M18 118 Q24 108 30 118 Q36 108 42 118 Q48 108 54 118 Q60 108 66 118 Q72 108 78 118 Q84 108 90 118 Q96 108 102 118 Q108 108 110 116 L110 80 Q64 62 18 80 Z"/>
    <rect class="s-fill-cold" x="12" y="120" width="104" height="8"/>
    <path class="s-line" d="M12 120 H116"/>
    <text class="s-tiny" x="64" y="146" text-anchor="middle">crêtes de la peau</text>
  </g>

  <!-- Étape 2 : dépôt d'un film gras sous chaque crête -->
  <g>
    <circle class="s-badge" cx="138" cy="30" r="9"/>
    <text class="s-badge-text" x="138" y="30">2</text>
    <text class="s-label" x="152" y="34">Dépôt</text>

    <text class="s-tiny" x="180" y="84" text-anchor="middle">film gras</text>
    <text class="s-tiny" x="180" y="98" text-anchor="middle">invisible</text>
    <path class="s-leader" d="M180 102 V114" marker-end="url(#mg-dot)"/>
    <ellipse class="s-fill-accent" cx="138" cy="117" rx="4" ry="2.5"/>
    <ellipse class="s-fill-accent" cx="150" cy="117" rx="4" ry="2.5"/>
    <ellipse class="s-fill-accent" cx="162" cy="117" rx="4" ry="2.5"/>
    <ellipse class="s-fill-accent" cx="174" cy="117" rx="4" ry="2.5"/>
    <ellipse class="s-fill-accent" cx="186" cy="117" rx="4" ry="2.5"/>
    <ellipse class="s-fill-accent" cx="198" cy="117" rx="4" ry="2.5"/>
    <ellipse class="s-fill-accent" cx="210" cy="117" rx="4" ry="2.5"/>
    <ellipse class="s-fill-accent" cx="222" cy="117" rx="4" ry="2.5"/>
    <rect class="s-fill-cold" x="126" y="120" width="106" height="8"/>
    <path class="s-line" d="M126 120 H232"/>
    <path class="s-dim" d="M138 138 H150" marker-start="url(#mg-tick)" marker-end="url(#mg-tick)"/>
    <text class="s-tiny" x="146" y="152" text-anchor="middle">≈ 0,5 mm</text>
  </g>

  <!-- Étape 3 : la poudre ne tient que sur le film gras -->
  <g>
    <circle class="s-badge" cx="254" cy="30" r="9"/>
    <text class="s-badge-text" x="254" y="30">3</text>
    <text class="s-label" x="268" y="34">Poudre</text>

    <circle class="s-solid s-float" cx="262" cy="66" r="1.8"/>
    <circle class="s-solid s-float s-delay-1" cx="282" cy="82" r="1.8"/>
    <circle class="s-solid s-float s-delay-2" cx="302" cy="60" r="1.8"/>
    <circle class="s-solid s-float s-delay-3" cx="322" cy="78" r="1.8"/>
    <circle class="s-solid s-float" cx="292" cy="98" r="1.8"/>
    <circle class="s-solid s-float s-delay-2" cx="334" cy="96" r="1.8"/>

    <ellipse class="s-fill-accent" cx="254" cy="117" rx="4" ry="2.5"/>
    <ellipse class="s-fill-accent" cx="266" cy="117" rx="4" ry="2.5"/>
    <ellipse class="s-fill-accent" cx="278" cy="117" rx="4" ry="2.5"/>
    <ellipse class="s-fill-accent" cx="290" cy="117" rx="4" ry="2.5"/>
    <ellipse class="s-fill-accent" cx="302" cy="117" rx="4" ry="2.5"/>
    <ellipse class="s-fill-accent" cx="314" cy="117" rx="4" ry="2.5"/>
    <ellipse class="s-fill-accent" cx="326" cy="117" rx="4" ry="2.5"/>
    <ellipse class="s-fill-accent" cx="338" cy="117" rx="4" ry="2.5"/>
    <path class="s-line" d="M251 114 H257 M263 114 H269 M275 114 H281 M287 114 H293 M299 114 H305 M311 114 H317 M323 114 H329 M335 114 H341"/>
    <rect class="s-fill-cold" x="242" y="120" width="106" height="8"/>
    <path class="s-line" d="M242 120 H348"/>
    <text class="s-tiny" x="295" y="146" text-anchor="middle">poudre retenue</text>
  </g>

  <!-- Résultat : le motif apparaît -->
  <g>
    <rect class="s-callout" x="14" y="168" width="210" height="44" rx="4"/>
    <text class="s-tiny" x="119" y="186" text-anchor="middle">Grains très fins : collent au</text>
    <text class="s-tiny" x="119" y="200" text-anchor="middle">film gras, pas au verre sec</text>
    <path class="s-leader" d="M224 190 H270" marker-end="url(#mg-dot)"/>

    <ellipse class="s-thin s-draw" pathLength="1" cx="300" cy="184" rx="28" ry="30"/>
    <ellipse class="s-thin s-draw s-delay-1" pathLength="1" cx="300" cy="186" rx="20" ry="22"/>
    <ellipse class="s-thin s-draw s-delay-2" pathLength="1" cx="300" cy="188" rx="12" ry="14"/>
    <ellipse class="s-thin s-draw s-delay-3" pathLength="1" cx="300" cy="190" rx="5" ry="6"/>
    <text class="s-tiny" x="300" y="228" text-anchor="middle">motif révélé</text>
  </g>
</svg>
