<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- 1 : canette dont la vapeur s'est condensée -->
  <g>
    <circle class="s-badge" cx="24" cy="26" r="9"/>
    <text class="s-badge-text" x="24" y="26">1</text>
    <text class="s-label" x="38" y="30">Canette refroidie</text>
    <path class="s-solid" d="M56 70 H116 L111 95 L117 120 L111 145 L116 170 H56 L61 145 L55 120 L61 95 Z"/>
    <rect class="s-solid" x="72" y="64" width="28" height="6" rx="2"/>
    <text class="s-tiny" x="86" y="114" text-anchor="middle">pression</text>
    <text class="s-tiny s-text-cold" x="86" y="128" text-anchor="middle">faible</text>
    <g class="s-pulse">
      <path class="s-line" d="M22 92 H50" marker-end="url(#mg-arrow)"/>
      <path class="s-line" d="M22 120 H48" marker-end="url(#mg-arrow)"/>
      <path class="s-line" d="M22 148 H50" marker-end="url(#mg-arrow)"/>
      <path class="s-line" d="M150 92 H122" marker-end="url(#mg-arrow)"/>
      <path class="s-line" d="M150 120 H124" marker-end="url(#mg-arrow)"/>
      <path class="s-line" d="M150 148 H122" marker-end="url(#mg-arrow)"/>
      <path class="s-line" d="M86 40 V58" marker-end="url(#mg-arrow)"/>
    </g>
    <text class="s-small" x="86" y="192" text-anchor="middle">≈ 1 bar dehors</text>
    <text class="s-tiny" x="86" y="210" text-anchor="middle">la vapeur se condense</text>
    <text class="s-tiny" x="86" y="224" text-anchor="middle">l'air extérieur écrase</text>
  </g>

  <path class="s-dash" d="M180 44 V228"/>

  <!-- 2 : paille : l'air pousse le liquide -->
  <g>
    <circle class="s-badge" cx="196" cy="26" r="9"/>
    <text class="s-badge-text" x="196" y="26">2</text>
    <text class="s-label" x="210" y="30">Paille</text>
    <polygon class="s-fill-cold" points="221.8,140 306.2,140 302,210 226,210"/>
    <path class="s-cold" d="M222 140 H258 M268 140 H306"/>
    <path class="s-line" d="M220 110 L226 210 H302 L308 110"/>
    <rect class="s-fill-cold s-pulse" x="258" y="86" width="10" height="54"/>
    <path class="s-line" d="M258 56 V200 M268 56 V200"/>
    <path class="s-cold s-flow" d="M263 136 V80" marker-end="url(#mg-arrow-cold)"/>
    <path class="s-line" d="M234 98 V134" marker-end="url(#mg-arrow)"/>
    <path class="s-line" d="M292 98 V134" marker-end="url(#mg-arrow)"/>
    <text class="s-tiny" x="234" y="92" text-anchor="middle">1 bar</text>
    <text class="s-tiny" x="292" y="92" text-anchor="middle">1 bar</text>
    <rect class="s-callout" x="282" y="44" width="62" height="32" rx="4"/>
    <text class="s-tiny" x="313" y="57" text-anchor="middle">pression</text>
    <text class="s-tiny s-text-cold" x="313" y="70" text-anchor="middle">réduite</text>
    <path class="s-leader" d="M282 60 H268" marker-end="url(#mg-dot)"/>
    <text class="s-tiny" x="264" y="228" text-anchor="middle">l'air pousse le liquide</text>
  </g>
</svg>
