<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- Sol -->
  <path class="s-line" d="M12 206 H348"/>

  <!-- Pompe à pied, manomètre et long tuyau -->
  <g>
    <rect class="s-solid" x="54" y="140" width="16" height="64" rx="2"/>
    <path class="s-line" d="M44 204 H80"/>
    <path class="s-line" d="M62 140 V120 M50 120 H74"/>
    <path class="s-line" d="M150 184 V194 Q150 198 146 198 H70"/>
    <path class="s-line" d="M98 195 V198"/>
    <circle class="s-solid" cx="98" cy="186" r="9"/>
    <path class="s-hot" d="M98 186 L103 181"/>
  </g>

  <!-- Fusée sur son pas de tir : air comprimé et 1/3 d'eau -->
  <g>
    <path class="s-line" d="M126 206 L140 164 M174 206 L160 164"/>
    <polygon class="s-solid" points="132,132 120,166 132,158"/>
    <polygon class="s-solid" points="168,132 180,166 168,158"/>
    <polygon class="s-solid" points="132,70 150,44 168,70"/>
    <path class="s-solid" d="M132 70 H168 V150 Q168 160 156 166 V176 H144 V166 Q132 160 132 150 Z"/>
    <rect class="s-fill-accent s-pulse" x="133" y="71" width="34" height="52"/>
    <path class="s-fill-cold" d="M133 124 H167 V150 Q167 159 155 165 V176 H145 V165 Q133 159 133 150 Z"/>
    <rect class="s-solid" x="144" y="176" width="12" height="8" rx="1"/>
    <text class="s-tiny" x="186" y="93">air comprimé</text>
    <path class="s-leader" d="M184 89 L170 89" marker-end="url(#mg-dot)"/>
    <text class="s-tiny s-text-cold" x="186" y="131">eau (1/3)</text>
    <path class="s-leader" d="M184 127 L168 127" marker-end="url(#mg-dot)"/>
  </g>

  <!-- Fusée en vol : jet d'eau vers le bas, poussée vers le haut -->
  <g>
    <polygon class="s-solid" points="300,60 312,42 324,60"/>
    <path class="s-solid" d="M300 60 H324 V106 Q324 112 316 116 V122 H308 V116 Q300 112 300 106 Z"/>
    <path class="s-fill-cold" d="M301 100 H323 V106 Q323 111 315 115 V122 H309 V115 Q301 111 301 106 Z"/>
    <path class="s-cold s-flow" d="M312 124 V174" marker-end="url(#mg-arrow-cold)"/>
    <path class="s-cold s-flow" d="M308 124 L296 168" marker-end="url(#mg-arrow-cold)"/>
    <path class="s-cold s-flow" d="M316 124 L328 168" marker-end="url(#mg-arrow-cold)"/>
    <text class="s-tiny s-text-cold" x="312" y="190" text-anchor="middle">jet d'eau</text>
    <path class="s-accent" d="M278 112 V56" marker-end="url(#mg-arrow)"/>
    <text class="s-tiny s-text-accent" x="278" y="126" text-anchor="middle">poussée</text>
  </g>

  <!-- Étape 1 : pomper -->
  <g>
    <circle class="s-badge" cx="24" cy="30" r="9"/>
    <text class="s-badge-text" x="24" y="30">1</text>
    <text class="s-label" x="38" y="34">Pomper</text>
    <text class="s-tiny s-text-hot" x="38" y="48">3 bar maximum</text>
    <path class="s-leader" d="M58 54 L61 114" marker-end="url(#mg-dot)"/>
  </g>

  <!-- Étape 2 : tirer à distance -->
  <g>
    <circle class="s-badge" cx="24" cy="222" r="9"/>
    <text class="s-badge-text" x="24" y="222">2</text>
    <text class="s-label" x="38" y="226">Tuyau de 5 m</text>
    <path class="s-leader" d="M132 218 L120 200" marker-end="url(#mg-dot)"/>
  </g>

  <!-- Étape 3 : propulsion -->
  <g>
    <circle class="s-badge" cx="230" cy="30" r="9"/>
    <text class="s-badge-text" x="230" y="30">3</text>
    <text class="s-label" x="244" y="34">Propulsion</text>
  </g>

  <!-- Encadré sécurité -->
  <g>
    <rect class="s-callout" x="226" y="196" width="120" height="34" rx="4"/>
    <text class="s-tiny s-text-hot" x="286" y="210" text-anchor="middle">Personne devant</text>
    <text class="s-tiny s-text-hot" x="286" y="224" text-anchor="middle">ni au-dessus</text>
  </g>
</svg>
