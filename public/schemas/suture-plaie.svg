<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- Un point rapproche les bords ; une aiguille non stérile fait entrer des bactéries -->
  <circle class="s-badge" cx="24" cy="20" r="9"/>
  <text class="s-badge-text" x="24" y="20">1</text>
  <text class="s-label" x="38" y="24">Rapprocher les bords</text>
  <rect class="s-fill-hot" x="20" y="60" width="140" height="16"/>
  <rect class="s-solid" x="20" y="76" width="64" height="60"/>
  <rect class="s-solid" x="96" y="76" width="64" height="60"/>
  <path class="s-accent" d="M70 76 C70 120, 110 120, 110 76"/>
  <path class="s-accent" d="M70 76 L64 70 M110 76 L116 70"/>
  <text class="s-tiny" x="90" y="156" text-anchor="middle">comme une agrafe</text>
  <path class="s-thin" d="M186 40 V176"/>
  <circle class="s-badge-hot" cx="204" cy="20" r="9"/>
  <text class="s-badge-text" x="204" y="20">2</text>
  <text class="s-label" x="218" y="24">Le vrai danger</text>
  <rect class="s-fill-hot" x="204" y="60" width="140" height="16"/>
  <rect class="s-solid" x="204" y="76" width="140" height="60"/>
  <circle class="s-fill-hot s-pulse" cx="240" cy="104" r="4"/>
  <circle class="s-fill-hot s-pulse s-delay-1" cx="256" cy="116" r="4"/>
  <circle class="s-fill-hot s-pulse s-delay-2" cx="272" cy="100" r="4"/>
  <circle class="s-fill-hot s-pulse" cx="290" cy="112" r="4"/>
  <path class="s-hot" d="M300 52 L270 92" marker-end="url(#mg-arrow-hot)"/>
  <text class="s-tiny s-text-hot" x="306" y="48">aiguille</text>
  <text class="s-tiny" x="274" y="156" text-anchor="middle">bactéries sous la peau</text>
  <rect class="s-callout" x="14" y="186" width="332" height="38" rx="4"/>
  <text class="s-tiny" x="180" y="201" text-anchor="middle">Fermer est mécanique ; le danger est microbien</text>
  <text class="s-tiny s-text-accent" x="180" y="216" text-anchor="middle">la désinfection compte plus que la fermeture</text>
</svg>
