<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- Une durite fissurée bouchée par du chewing-gum : tient à froid, coule quand le moteur chauffe -->
  <g>
    <circle class="s-badge" cx="24" cy="20" r="9"/>
    <text class="s-badge-text" x="24" y="20">1</text>
    <text class="s-label" x="38" y="24">Tiède : ça tient</text>
    <rect class="s-solid" x="14" y="70" width="150" height="40" rx="20"/>
    <rect class="s-fill-cold" x="22" y="78" width="134" height="24" rx="12"/>
    <path class="s-line" d="M84 70 L88 64 L84 58"/>
    <path class="s-solid" d="M64 70 C64 50, 108 50, 108 70 Z"/>
    <path class="s-fill-accent" d="M64 70 C64 50, 108 50, 108 70 Z"/>
    <text class="s-tiny s-text-accent" x="86" y="44" text-anchor="middle">chewing-gum</text>
    <text class="s-tiny" x="89" y="128" text-anchor="middle">fissure bouchée</text>
  </g>
  <g>
    <circle class="s-badge-hot" cx="206" cy="20" r="9"/>
    <text class="s-badge-text" x="206" y="20">2</text>
    <text class="s-label" x="220" y="24">Moteur chaud</text>
    <rect class="s-solid" x="196" y="70" width="150" height="40" rx="20"/>
    <rect class="s-fill-cold" x="204" y="78" width="134" height="24" rx="12"/>
    <path class="s-line" d="M266 70 L270 64 L266 58"/>
    <path class="s-solid" d="M246 70 C246 60, 290 60, 290 70 L290 92 C286 100, 282 92, 280 104 C276 96, 268 104, 262 96 Z"/>
    <path class="s-fill-hot s-pulse" d="M246 70 C246 60, 290 60, 290 70 L290 92 C286 100, 282 92, 280 104 C276 96, 268 104, 262 96 Z"/>
    <path class="s-cold s-flow" d="M268 58 V36" marker-end="url(#mg-arrow-cold)"/>
    <text class="s-tiny s-text-hot" x="271" y="128" text-anchor="middle">il ramollit et coule</text>
    <text class="s-tiny s-text-cold" x="300" y="43">la fuite</text>
    <text class="s-tiny s-text-cold" x="300" y="57">reprend</text>
  </g>
  <g>
    <path class="s-dim" d="M40 176 H320" marker-end="url(#mg-arrow-hot)"/>
    <circle class="s-badge" cx="70" cy="176" r="4"/>
    <circle class="s-badge-hot" cx="290" cy="176" r="4"/>
    <text class="s-tiny" x="70" y="194" text-anchor="middle">tiède : ça tient</text>
    <text class="s-tiny s-text-hot" x="290" y="194" text-anchor="middle">près de 90 °C</text>
    <text class="s-tiny" x="180" y="168" text-anchor="middle">température de la durite</text>
  </g>
  <g>
    <rect class="s-callout" x="14" y="204" width="332" height="26" rx="4"/>
    <text class="s-tiny" x="180" y="221" text-anchor="middle">Malléable pour épouser la fissure, puis stable</text>
  </g>
</svg>
