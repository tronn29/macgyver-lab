<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- Fil de cuivre tendu en travers d'un passage, dans une boucle avec une pile et un buzzer -->
  <g>
    <circle class="s-badge" cx="24" cy="20" r="9"/>
    <text class="s-badge-text" x="24" y="20">1</text>
    <text class="s-label" x="38" y="24">Fil tendu en travers du passage</text>
    <rect class="s-solid" x="40" y="44" width="18" height="120" rx="2"/>
    <rect class="s-solid" x="302" y="44" width="18" height="120" rx="2"/>
    <text class="s-tiny" x="49" y="178" text-anchor="middle">mur</text>
    <text class="s-tiny" x="311" y="178" text-anchor="middle">mur</text>
    <path class="s-accent" d="M58 120 H302"/>
    <text class="s-small s-text-accent" x="244" y="112" text-anchor="middle">fil de cuivre fin</text>
    <path class="s-hot s-flow" d="M180 70 V108" marker-end="url(#mg-arrow-hot)"/>
    <text class="s-tiny s-text-hot" x="180" y="62" text-anchor="middle">quelqu'un passe</text>
    <path class="s-line" d="M58 150 H100 M140 150 H220 M260 150 H302"/>
    <path class="s-line" d="M300 120 C312 120, 312 150, 300 150" />
    <rect class="s-solid" x="100" y="140" width="40" height="20" rx="3"/>
    <text class="s-tiny" x="120" y="154" text-anchor="middle">pile</text>
    <rect class="s-solid" x="220" y="140" width="40" height="20" rx="3"/>
    <text class="s-tiny" x="240" y="154" text-anchor="middle">buzzer</text>
    <path class="s-line" d="M60 120 C48 120, 48 150, 60 150"/>
  </g>
  <g>
    <rect class="s-callout" x="14" y="190" width="332" height="38" rx="4"/>
    <text class="s-tiny" x="180" y="205" text-anchor="middle">Fil intact : circuit fermé, le courant circule</text>
    <text class="s-tiny s-text-hot" x="180" y="220" text-anchor="middle">Fil cassé : circuit ouvert, l'alerte se déclenche</text>
  </g>
</svg>
