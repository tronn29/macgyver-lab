<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- Schéma d'exemple générique : duplique ce fichier, renomme-le (ex. : ma-fiche.svg)
       et remplace chaque texte entre crochets. Classes autorisées : voir CONTENU.md. -->

  <!-- Étape 1 : l'objet de départ -->
  <g>
    <circle class="s-badge" cx="24" cy="28" r="9"/>
    <text class="s-badge-text" x="24" y="28">1</text>
    <text class="s-label" x="38" y="32">[Étape 1]</text>
    <rect class="s-solid" x="20" y="50" width="80" height="56" rx="6"/>
    <text class="s-small" x="60" y="82" text-anchor="middle">[objet]</text>
    <path class="s-accent s-flow" d="M106 78 H132" marker-end="url(#mg-arrow-accent)"/>
  </g>

  <!-- Étape 2 : ce qui se passe (chaleur, pression, courant…) -->
  <g>
    <circle class="s-badge" cx="144" cy="28" r="9"/>
    <text class="s-badge-text" x="144" y="28">2</text>
    <text class="s-label" x="158" y="32">[Étape 2]</text>
    <circle class="s-solid" cx="180" cy="78" r="28"/>
    <circle class="s-fill-hot s-pulse" cx="180" cy="78" r="14"/>
    <text class="s-small" x="180" y="124" text-anchor="middle">[effet]</text>
    <path class="s-cold s-flow" d="M212 78 H252" marker-end="url(#mg-arrow-cold)"/>
  </g>

  <!-- Étape 3 : le résultat -->
  <g>
    <circle class="s-badge" cx="264" cy="28" r="9"/>
    <text class="s-badge-text" x="264" y="28">3</text>
    <text class="s-label" x="278" y="32">[Étape 3]</text>
    <rect class="s-fill-cold" x="260" y="50" width="80" height="56" rx="6"/>
    <rect class="s-ghost" x="260" y="50" width="80" height="56" rx="6"/>
    <text class="s-small" x="300" y="82" text-anchor="middle">[résultat]</text>
  </g>

  <!-- Encadré de légende relié à l'étape 2 -->
  <g>
    <rect class="s-callout" x="20" y="142" width="150" height="44" rx="4"/>
    <text class="s-tiny" x="95" y="160" text-anchor="middle">[légende courte]</text>
    <text class="s-tiny s-text-accent" x="95" y="175" text-anchor="middle">[deuxième ligne]</text>
    <path class="s-leader" d="M170 160 L178 108" marker-end="url(#mg-dot)"/>
  </g>

  <!-- Cote (valeur mesurée) et repères chaud / froid -->
  <g>
    <path class="s-dim" d="M260 150 H340" marker-start="url(#mg-tick)" marker-end="url(#mg-tick)"/>
    <text class="s-tiny" x="300" y="166" text-anchor="middle">[cote : 57 bar]</text>
    <text class="s-tiny s-text-hot" x="276" y="190" text-anchor="middle">[chaud]</text>
    <text class="s-tiny s-text-cold" x="324" y="190" text-anchor="middle">[froid]</text>
  </g>

  <text class="s-tiny" x="180" y="224" text-anchor="middle">[Remplace chaque texte entre crochets]</text>
</svg>
