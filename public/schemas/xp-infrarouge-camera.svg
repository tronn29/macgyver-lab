<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- Télécommande et sa LED infrarouge -->
  <g>
    <rect class="s-solid" x="20" y="90" width="80" height="26" rx="6"/>
    <circle class="s-line" cx="36" cy="103" r="3"/>
    <circle class="s-line" cx="50" cy="103" r="3"/>
    <circle class="s-line" cx="64" cy="103" r="3"/>
    <rect class="s-line" x="76" y="98" width="14" height="10" rx="2"/>
    <ellipse class="s-fill-hot s-blink" cx="104" cy="103" rx="4" ry="5"/>
  </g>

  <!-- Faisceau infrarouge vers la caméra frontale -->
  <g>
    <path class="s-hot s-flow" d="M112 100 L266 66" marker-end="url(#mg-arrow-hot)"/>
    <path class="s-hot s-flow s-delay-1" d="M112 106 L264 72" marker-end="url(#mg-arrow-hot)"/>
  </g>

  <!-- Téléphone : la lueur apparaît à l'écran -->
  <g>
    <rect class="s-solid" x="252" y="52" width="48" height="104" rx="8"/>
    <circle class="s-line" cx="276" cy="62" r="3"/>
    <rect class="s-fill-muted" x="258" y="72" width="36" height="76" rx="3"/>
    <circle class="s-fill-accent s-pulse" cx="276" cy="108" r="10"/>
    <circle class="s-fill-accent" cx="276" cy="108" r="4"/>
    <rect class="s-callout" x="230" y="162" width="92" height="20" rx="4"/>
    <text class="s-tiny s-text-accent" x="276" y="176" text-anchor="middle">lueur à l'écran</text>
    <path class="s-leader" d="M276 162 V120" marker-end="url(#mg-dot)"/>
  </g>

  <!-- L'œil ne voit rien -->
  <g>
    <path class="s-dash" d="M104 110 L86 158"/>
    <path class="s-hot" d="M90 128 L102 140 M102 128 L90 140"/>
    <path class="s-line" d="M50 170 Q70 156 90 170 Q70 184 50 170 Z"/>
    <circle class="s-line" cx="70" cy="170" r="4"/>
  </g>

  <!-- Spectre : visible puis infrarouge -->
  <g>
    <text class="s-tiny" x="116" y="194" text-anchor="middle">visible</text>
    <text class="s-tiny s-text-hot" x="256" y="194" text-anchor="middle">infrarouge</text>
    <rect class="s-fill-accent" x="40" y="200" width="152" height="8"/>
    <rect class="s-fill-hot" x="192" y="200" width="128" height="8"/>
    <path class="s-hot" d="M256 197 V212"/>
    <text class="s-tiny" x="40" y="222" text-anchor="middle">400 nm</text>
    <text class="s-tiny" x="192" y="222" text-anchor="middle">780</text>
    <text class="s-tiny s-text-hot" x="256" y="222" text-anchor="middle">940</text>
    <text class="s-tiny" x="320" y="222" text-anchor="middle">1 100 nm</text>
  </g>

  <!-- Étape 1 : télécommande -->
  <g>
    <circle class="s-badge" cx="24" cy="30" r="9"/>
    <text class="s-badge-text" x="24" y="30">1</text>
    <text class="s-label" x="38" y="34">Télécommande</text>
    <text class="s-tiny s-text-hot" x="38" y="48">LED IR à 940 nm</text>
    <path class="s-leader" d="M112 54 L105 96" marker-end="url(#mg-dot)"/>
  </g>

  <!-- Étape 2 : caméra frontale -->
  <g>
    <circle class="s-badge" cx="190" cy="30" r="9"/>
    <text class="s-badge-text" x="190" y="30">2</text>
    <text class="s-label" x="204" y="34">Caméra frontale</text>
    <text class="s-tiny" x="204" y="46">filtre IR souvent faible</text>
  </g>

  <!-- Étape 3 : l'œil -->
  <g>
    <circle class="s-badge" cx="112" cy="170" r="9"/>
    <text class="s-badge-text" x="112" y="170">3</text>
    <text class="s-label" x="126" y="174">Œil : rien</text>
  </g>
</svg>
