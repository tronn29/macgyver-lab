  <circle class="s-badge" cx="138" cy="20" r="9"/>
  <text class="s-badge-text" x="138" y="20">2</text>
  <text class="s-small" x="152" y="24">Chaleur douce</text>
  <circle class="s-badge-hot" cx="262" cy="20" r="9"/>
