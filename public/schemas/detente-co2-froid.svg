<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- Étape 1 : bouteille de CO₂ sous pression et diffuseur -->
  <g>
    <rect class="s-solid" x="18" y="70" width="44" height="120" rx="14"/>
    <rect class="s-solid" x="32" y="52" width="16" height="20" rx="3"/>
    <path class="s-line" d="M48 60 H78 L92 54 V66 L78 62"/>
    <text class="s-small" x="40" y="132" text-anchor="middle">CO₂</text>
    <text class="s-small" x="40" y="146" text-anchor="middle">liquide</text>
    <text class="s-tiny" x="40" y="206" text-anchor="middle">≈ 57 bar</text>
    <circle class="s-badge" cx="40" cy="30" r="9"/>
    <text class="s-badge-text" x="40" y="30">1</text>
    <text class="s-label" x="54" y="34">Détente</text>
  </g>

  <!-- Jet qui se détend : le gaz se diffuse et refroidit -->
  <g>
    <path class="s-cold s-flow" d="M94 60 C120 60 136 70 156 86" marker-end="url(#mg-arrow-cold)"/>
    <path class="s-cold s-flow" d="M94 58 C122 52 142 50 166 52" marker-end="url(#mg-arrow-cold)"/>
    <circle class="s-fill-cold s-diffuse" cx="130" cy="64" r="16"/>
    <circle class="s-fill-cold s-diffuse s-delay-1" cx="150" cy="70" r="20"/>
    <circle class="s-fill-cold s-diffuse s-delay-2" cx="140" cy="58" r="12"/>
  </g>

  <!-- Étape 2 : chute de température -->
  <g>
    <circle class="s-badge" cx="196" cy="30" r="9"/>
    <text class="s-badge-text" x="196" y="30">2</text>
    <text class="s-label" x="210" y="34">Refroidissement</text>
    <rect class="s-solid" x="190" y="52" width="12" height="70" rx="6"/>
    <circle class="s-solid" cx="196" cy="130" r="11"/>
    <rect class="s-fill-cold" x="193" y="96" width="6" height="30" rx="3"/>
    <circle class="s-fill-cold" cx="196" cy="130" r="7"/>
    <path class="s-thin" d="M204 62 H210 M204 76 H210 M204 90 H210 M204 104 H210"/>
    <text class="s-tiny" x="214" y="65">+20 °C</text>
    <text class="s-tiny s-text-cold" x="214" y="107">−78 °C</text>
    <path class="s-cold" d="M254 66 V100" marker-end="url(#mg-arrow-cold)"/>
  </g>

  <!-- Étape 3 : le métal froid se contracte -->
  <g>
    <circle class="s-badge" cx="40" cy="226" r="9" transform="translate(0 -6)"/>
    <text class="s-badge-text" x="40" y="220">3</text>
    <text class="s-label" x="54" y="224">Contraction du métal</text>

    <rect class="s-solid" x="200" y="160" width="140" height="22" rx="2"/>
    <rect class="s-fill-cold s-pulse" x="246" y="160" width="48" height="22"/>
    <path class="s-cold" d="M236 150 H262" marker-end="url(#mg-arrow-cold)"/>
    <path class="s-cold" d="M304 150 H278" marker-end="url(#mg-arrow-cold)"/>
    <path class="s-hot" d="M268 182 L264 192 L272 197 L267 204"/>
    <path class="s-dim" d="M200 210 H340" marker-start="url(#mg-tick)" marker-end="url(#mg-tick)"/>
    <text class="s-tiny" x="270" y="225" text-anchor="middle">barreau : ΔL = α · L · ΔT</text>

    <rect class="s-callout" x="108" y="150" width="84" height="44" rx="4"/>
    <text class="s-tiny" x="150" y="166" text-anchor="middle">Métal fin :</text>
    <text class="s-tiny s-text-hot" x="150" y="180" text-anchor="middle">fragilisé</text>
    <path class="s-leader" d="M192 172 H246" marker-end="url(#mg-dot)"/>
  </g>
</svg>
