<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- 1 : poulie fixe -->
  <g>
    <circle class="s-badge" cx="24" cy="26" r="9"/>
    <text class="s-badge-text" x="24" y="26">1</text>
    <text class="s-label" x="38" y="30">Poulie fixe</text>
    <path class="s-line" d="M30 48 H150"/>
    <path class="s-thin" d="M40 48 l-6 -6 M56 48 l-6 -6 M72 48 l-6 -6 M88 48 l-6 -6 M104 48 l-6 -6 M120 48 l-6 -6 M136 48 l-6 -6 M150 48 l-6 -6"/>
    <path class="s-line" d="M90 48 V62"/>
    <circle class="s-solid" cx="90" cy="80" r="18"/>
    <path class="s-thin s-spin" d="M90 66 V94 M76 80 H104"/>
    <path class="s-line" d="M72 150 V80 A18 18 0 0 1 108 80 V150"/>
    <rect class="s-solid" x="52" y="150" width="40" height="32" rx="2"/>
    <text class="s-label" x="72" y="171" text-anchor="middle">P</text>
    <path class="s-accent s-flow" d="M108 150 V196" marker-end="url(#mg-arrow)"/>
    <text class="s-small s-text-accent" x="120" y="190">F = P</text>
    <text class="s-tiny" x="90" y="226" text-anchor="middle">change la direction</text>
  </g>

  <path class="s-dash" d="M180 44 V228"/>

  <!-- 2 : palan à deux brins porteurs -->
  <g>
    <circle class="s-badge" cx="196" cy="26" r="9"/>
    <text class="s-badge-text" x="196" y="26">2</text>
    <text class="s-label" x="210" y="30">Palan à 2 brins</text>
    <path class="s-line" d="M200 48 H340"/>
    <path class="s-thin" d="M210 48 l-6 -6 M226 48 l-6 -6 M242 48 l-6 -6 M258 48 l-6 -6 M274 48 l-6 -6 M290 48 l-6 -6 M306 48 l-6 -6 M322 48 l-6 -6 M338 48 l-6 -6"/>
    <path class="s-line" d="M290 48 V62"/>
    <circle class="s-solid" cx="290" cy="76" r="14"/>
    <path class="s-thin s-spin" d="M290 64 V88 M278 76 H302"/>
    <circle class="s-solid" cx="262" cy="150" r="14"/>
    <path class="s-thin s-spin" d="M262 138 V162 M250 150 H274"/>
    <path class="s-line" d="M248 48 V150 A14 14 0 0 0 276 150 V76 A14 14 0 0 1 304 76 V150"/>
    <path class="s-line" d="M262 164 V176"/>
    <rect class="s-solid" x="242" y="176" width="40" height="30" rx="2"/>
    <text class="s-label" x="262" y="196" text-anchor="middle">P</text>
    <path class="s-accent s-flow" d="M304 150 V198" marker-end="url(#mg-arrow)"/>
    <text class="s-small s-text-accent" x="318" y="214" text-anchor="middle">F = P / 2</text>

    <rect class="s-callout" x="190" y="96" width="52" height="32" rx="4"/>
    <text class="s-tiny" x="216" y="109" text-anchor="middle">2 brins</text>
    <text class="s-tiny" x="216" y="122" text-anchor="middle">porteurs</text>
    <path class="s-leader" d="M242 112 H276" marker-end="url(#mg-dot)"/>
    <circle class="s-badge" cx="248" cy="112" r="2"/>
    <text class="s-tiny" x="266" y="228" text-anchor="middle">tirer 2 m pour monter 1 m</text>
  </g>
</svg>
