<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- Étape 1 : aimanter l'aiguille par frottement -->
  <g>
    <circle class="s-badge" cx="24" cy="30" r="9"/>
    <text class="s-badge-text" x="24" y="30">1</text>
    <text class="s-label" x="38" y="34">Frotter 30 fois</text>
    <path class="s-accent s-flow" d="M30 54 H140" marker-end="url(#mg-arrow)"/>
    <rect class="s-fill-hot" x="44" y="62" width="16" height="13"/>
    <rect class="s-fill-cold" x="60" y="62" width="16" height="13"/>
    <rect class="s-line" x="44" y="62" width="32" height="13"/>
    <text class="s-tiny" x="52" y="72" text-anchor="middle">N</text>
    <text class="s-tiny" x="68" y="72" text-anchor="middle">S</text>
    <polygon class="s-solid" points="26,80 136,77 144,80 136,83"/>
    <circle class="s-line" cx="34" cy="80" r="2"/>
    <text class="s-tiny" x="85" y="98" text-anchor="middle">un seul sens</text>
  </g>

  <!-- Bol, eau et flotteur -->
  <g>
    <path class="s-line" d="M170 140 Q176 200 250 204 Q324 200 330 140"/>
    <ellipse class="s-fill-cold" cx="250" cy="146" rx="72" ry="16"/>
    <ellipse class="s-line" cx="250" cy="140" rx="80" ry="20"/>
    <ellipse class="s-solid" cx="250" cy="147" rx="18" ry="6"/>
    <path class="s-line" d="M222 152 L278 140"/>
    <polygon class="s-fill-hot s-pulse" points="264,141 280,140 266,147"/>
    <text class="s-tiny s-text-hot" x="286" y="140">N</text>
    <text class="s-tiny" x="210" y="160">S</text>
  </g>

  <!-- Repère du nord -->
  <g>
    <path class="s-accent" d="M318 112 L330 74" marker-end="url(#mg-arrow)"/>
    <text class="s-small s-text-accent" x="334" y="70">N</text>
  </g>

  <!-- Étape 2 : poser sur l'eau -->
  <g>
    <circle class="s-badge" cx="24" cy="128" r="9"/>
    <text class="s-badge-text" x="24" y="128">2</text>
    <text class="s-label" x="38" y="132">Poser sur l'eau</text>
    <text class="s-tiny" x="38" y="146">bol non métallique</text>
    <path class="s-leader" d="M154 128 L232 146" marker-end="url(#mg-dot)"/>
  </g>

  <!-- Étape 3 : axe nord-sud -->
  <g>
    <circle class="s-badge" cx="196" cy="30" r="9"/>
    <text class="s-badge-text" x="196" y="30">3</text>
    <text class="s-label" x="210" y="34">Axe nord-sud</text>
    <text class="s-tiny" x="210" y="48">vérifier au téléphone</text>
  </g>

  <!-- Encadré : champ terrestre -->
  <g>
    <rect class="s-callout" x="12" y="170" width="138" height="56" rx="4"/>
    <text class="s-tiny" x="81" y="186" text-anchor="middle">Champ terrestre :</text>
    <text class="s-tiny" x="81" y="200" text-anchor="middle">l'aiguille aimantée</text>
    <text class="s-tiny s-text-accent" x="81" y="214" text-anchor="middle">s'aligne dessus</text>
    <path class="s-leader" d="M150 198 L226 152" marker-end="url(#mg-dot)"/>
  </g>
</svg>
