<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- Une cellule aluminium, tissu imbibé, cuivre ; plusieurs cellules en série -->
  <circle class="s-badge" cx="24" cy="20" r="9"/>
  <text class="s-badge-text" x="24" y="20">1</text>
  <text class="s-label" x="38" y="24">Une cellule</text>
  <rect class="s-solid" x="30" y="60" width="18" height="90"/>
  <rect class="s-fill-cold" x="30" y="60" width="18" height="90"/>
  <rect class="s-fill-accent" x="52" y="60" width="16" height="90"/>
  <rect class="s-solid" x="72" y="60" width="18" height="90"/>
  <rect class="s-fill-hot" x="72" y="60" width="18" height="90"/>
  <text class="s-tiny s-text-cold" x="39" y="166" text-anchor="middle">alu</text>
  <text class="s-tiny s-text-accent" x="60" y="182" text-anchor="middle">tissu + vinaigre</text>
  <text class="s-tiny s-text-hot" x="81" y="166" text-anchor="middle">cuivre</text>
  <path class="s-line" d="M39 60 V44 H81 V60"/>
  <path class="s-accent s-flow" d="M46 44 H74" marker-end="url(#mg-arrow-accent)"/>
  <text class="s-tiny" x="88" y="48">courant</text>
  <text class="s-tiny" x="100" y="112">≈ un demi-volt</text>
  <path class="s-thin" d="M200 40 V176"/>
  <circle class="s-badge" cx="216" cy="20" r="9"/>
  <text class="s-badge-text" x="216" y="20">2</text>
  <text class="s-label" x="230" y="24">En série</text>
  <rect class="s-solid" x="218" y="70" width="10" height="70"/><rect class="s-fill-cold" x="218" y="70" width="10" height="70"/>
  <rect class="s-fill-accent" x="229" y="70" width="8" height="70"/>
  <rect class="s-solid" x="238" y="70" width="10" height="70"/><rect class="s-fill-hot" x="238" y="70" width="10" height="70"/>
  <rect class="s-solid" x="256" y="70" width="10" height="70"/><rect class="s-fill-cold" x="256" y="70" width="10" height="70"/>
  <rect class="s-fill-accent" x="267" y="70" width="8" height="70"/>
  <rect class="s-solid" x="276" y="70" width="10" height="70"/><rect class="s-fill-hot" x="276" y="70" width="10" height="70"/>
  <rect class="s-solid" x="294" y="70" width="10" height="70"/><rect class="s-fill-cold" x="294" y="70" width="10" height="70"/>
  <rect class="s-fill-accent" x="305" y="70" width="8" height="70"/>
  <rect class="s-solid" x="314" y="70" width="10" height="70"/><rect class="s-fill-hot" x="314" y="70" width="10" height="70"/>
  <text class="s-tiny s-text-accent" x="272" y="160" text-anchor="middle">tensions additionnées</text>
  <rect class="s-callout" x="14" y="190" width="332" height="38" rx="4"/>
  <text class="s-tiny" x="180" y="205" text-anchor="middle">Deux métaux différents + un liquide conducteur</text>
  <text class="s-tiny s-text-accent" x="180" y="220" text-anchor="middle">deux morceaux du même métal : aucun courant</text>
</svg>
