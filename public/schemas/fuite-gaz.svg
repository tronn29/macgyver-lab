<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240">
  <!-- Repérer une fuite à l'eau savonneuse ; réflexes face à une vraie fuite -->
  <circle class="s-badge" cx="24" cy="20" r="9"/>
  <text class="s-badge-text" x="24" y="20">1</text>
  <text class="s-label" x="38" y="24">Repérer une fuite</text>
  <rect class="s-solid" x="30" y="70" width="44" height="88" rx="14"/>
  <text class="s-tiny" x="52" y="174" text-anchor="middle">bouteille</text>
  <rect class="s-solid" x="44" y="56" width="16" height="14" rx="2"/>
  <path class="s-line" d="M60 62 H130"/>
  <rect class="s-solid" x="96" y="56" width="14" height="12" rx="2"/>
  <circle class="s-cold s-pulse" cx="104" cy="48" r="5"/>
  <circle class="s-cold s-pulse s-delay-1" cx="114" cy="40" r="4"/>
  <circle class="s-cold s-pulse s-delay-2" cx="98" cy="36" r="3"/>
  <text class="s-tiny s-text-cold" x="84" y="96">des bulles :</text>
  <text class="s-tiny s-text-cold" x="84" y="110">la fuite est là</text>
  <path class="s-thin" d="M186 40 V176"/>
  <circle class="s-badge-hot" cx="204" cy="20" r="9"/>
  <text class="s-badge-text" x="204" y="20">2</text>
  <text class="s-label" x="218" y="24">Vraie fuite</text>
  <text class="s-tiny" x="204" y="58">1. couper l'arrivée</text>
  <text class="s-tiny s-text-hot" x="204" y="80">2. ni flamme</text>
  <text class="s-tiny s-text-hot" x="204" y="94">   ni interrupteur</text>
  <text class="s-tiny" x="204" y="116">3. aérer, sortir</text>
  <text class="s-tiny" x="204" y="138">4. appeler les secours</text>
  <text class="s-tiny" x="204" y="152">   depuis l'extérieur</text>
  <rect class="s-callout" x="14" y="186" width="332" height="38" rx="4"/>
  <text class="s-tiny" x="180" y="201" text-anchor="middle">Gaz + air : risque d'explosion</text>
  <text class="s-tiny s-text-accent" x="180" y="216" text-anchor="middle">un bouchon de fortune ne règle rien</text>
</svg>
